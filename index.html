<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Feliz aniversario</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Caveat:wght@500&display=swap">
<style>
:root{--bg:#fff1f3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
.stage{position:relative;width:100%;height:100%}
.fig{position:absolute;bottom:calc(50% - 57px);width:130px;height:195px}
.fig.l{left:-140px;z-index:2}.fig.r{left:calc(100% + 20px);z-index:3}
.rig{position:absolute;left:0;top:0;width:260px;height:390px;transform:scale(.5);transform-origin:0 0}
.rig img{position:absolute;display:block}
.fig .body{position:absolute;inset:0;transform-origin:65px 195px}
.go .fig.l{animation:wl 4.5s ease-in-out forwards}
.go .fig.r{animation:wr 4.5s ease-in-out forwards}
@keyframes wl{to{left:calc(50% - 118px)}}
@keyframes wr{to{left:calc(50% - 15px)}}
.go .legL{animation:swa .9s ease-in-out 5}
.go .legR{animation:swb .9s ease-in-out 5}
@keyframes swa{25%{transform:rotate(14deg)}75%{transform:rotate(-14deg)}}
@keyframes swb{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.go .body{animation:bob .45s ease-in-out 10,float 3s ease-in-out 4.5s infinite}
@keyframes bob{25%{transform:translateY(-3px) rotate(1.5deg)}75%{transform:translateY(-3px) rotate(-1.5deg)}}
@keyframes float{50%{transform:translateY(-8px)}}
.bq{position:absolute;width:80px;height:110px;opacity:0}
.go .bq{animation:bqshow .01s linear 4.6s forwards}
@keyframes bqshow{to{opacity:1}}
.heart{position:absolute;left:50%;bottom:calc(50% - 116px);width:min(92vw,360px);margin-left:calc(min(92vw,360px) / -2);opacity:0;z-index:0;transform-origin:50% 55%}
.heart svg{display:block;width:100%;overflow:visible;fill:#e8486b}
.copy{position:absolute;left:0;right:0;top:calc(50% + 65px);text-align:center;padding:0 24px;color:#5b1d33;z-index:4}
.copy h1{font:600 clamp(28px,8.5vw,40px) 'Fraunces',Georgia,serif;margin:0 0 4px}
.copy p{font:500 clamp(23px,6.3vw,28px)/1.2 'Caveat',cursive;margin:0 auto;max-width:400px}
.go .heart{animation:grow 3.5s ease-out 4.6s forwards}
@keyframes grow{from{opacity:1;transform:scale(0)}to{opacity:1;transform:scale(1)}}
.w{white-space:nowrap}.c{opacity:0}.c.on{opacity:1}
@media (prefers-reduced-motion:reduce){.go *{animation-delay:0s!important;animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
